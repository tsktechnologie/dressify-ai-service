name: Python tests
on:
  push:
    branches: [dev-GPT, main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          INTERNAL_API_TOKEN: ci-test-secret
          JOB_DB_PATH: /tmp/dressify-ai-test-jobs.sqlite3
